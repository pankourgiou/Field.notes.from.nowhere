<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Field Notes from Nowhere</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Space+Mono&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#03040a;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
body.idle{cursor:none}
#hint{position:fixed;left:50%;top:9%;transform:translateX(-50%);font:12px 'Space Mono',monospace;color:#9fb4c8;opacity:0;transition:opacity .8s;pointer-events:none}
body:not(.idle) #hint{opacity:.7}
</style></head><body class="idle">
<canvas id="c"></canvas><div id="hint">space: pause &nbsp; f: fullscreen</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,DPR,S,vig,scan;
const TAU=Math.PI*2,clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,
sm=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)},R=(a,b)=>a+Math.random()*(b-a),RI=(a,b)=>Math.floor(R(a,b+1)),F=(x,d=2)=>x.toFixed(d);
function mul(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);S=Math.min(W/1100,H/640);
vig=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,0,0,.65)');
const s=document.createElement('canvas');s.width=4;s.height=4;const x=s.getContext('2d');x.fillStyle='rgba(0,0,0,.18)';x.fillRect(0,0,4,1);scan=g.createPattern(s,'repeat')}
addEventListener('resize',rs);rs();

const CHL=900,q=new URLSearchParams(location.search);
let T=Math.max(0,+q.get('fnt')||0),speed=clamp(+q.get('speed')||1,.1,200),paused=false,last=performance.now(),cam=0,wr=0,stepPh=0,curK=-1,LF=0,wind=0,wo=0;
const session=(Math.random()*1e5)|0;
const LOC={moon:['Mare Tranquillitatis','Shackleton Rim','Oceanus Procellarum','Tycho Ejecta Field','Sinus Iridum','Mare Imbrium'],mars:['Arcadia Planitia','Valles Marineris','Utopia Planitia','Hellas Basin','Olympus Mons Flank','Gale Crater']};
const chap=k=>{const pl=k%2?'mars':'moon',L=LOC[pl];return{pl,n:'Sol '+(14+k*83),loc:L[Math.floor(mul(session+k*31)()*L.length)]+', '+(pl==='mars'?'Mars':'Moon')}};
let SEED=0,mars=false,hue=205,sat=38,lig=84,h=0;
const lc=(a,l=lig,hs=0)=>`hsla(${hue+hs},${sat}%,${l}%,${a})`;

/* terrain */
const ridge=(x,k)=>{const s=SEED*.001;return Math.sin(x*.0021+s*k+k)*.5+Math.sin(x*.0057+s*3+k)*.28+Math.sin(x*.0131+s*7)*.14+Math.sin(x*.031+s)*.05};
const gy=wx=>H*.77+ridge(wx,0)*H*.02;

/* stars */
const rn=mul(99),stars=[...Array(200)].map(()=>({x:rn(),y:rn()*.7,r:rn()*1.3+.3,p:rn()*9}));
const edges=[];for(let i=0;i<70;i++)for(let j=i+1;j<70;j++){const dx=(stars[i].x-stars[j].x)*1.78,dy=stars[i].y-stars[j].y;if(dx*dx+dy*dy<.0049&&edges.length<60)edges.push([i,j])}

/* notebook */
const WEIRD=['2 + 2 = 5 (five of them)','Σ eyes = 7','they walk when I do not look','Δv = ? count them again','why is the sky blinking','the rover has 7 wheels now','∮ you · dl = ∞','my shadow is taller than me','they know my O₂ number','π ends. I saw where.','there are two of me at the ridge','x = x + ◉','do not divide by them','the ground is counting'];
const gens=[
()=>{const m=RI(3000,9000),f=m*R(.55,.9),v=R(2.8,4.4);return `Δv = ${F(v,1)}·ln(${m}/${Math.round(f)}) = ${F(v*Math.log(m/f))} km/s`},
()=>{const a=RI(3,9),b=RI(-9,9),c=RI(-12,-1),d=b*b-4*a*c;return `${a}x² ${b<0?'−':'+'} ${Math.abs(b)}x − ${-c} = 0 → x = ${F((-b+Math.sqrt(d))/(2*a))}`},
()=>{const r=RI(2,9);return `A = π·${r}² = ${F(Math.PI*r*r)} m²`},
()=>{const n=RI(5,12);let s=0;for(let i=1;i<=n;i++)s+=1/(i*i);return `Σ 1/k², k=1..${n} = ${F(s,4)}`},
()=>{const n=RI(2,6);return `∫₀^${n} x² dx = ${n}³/3 = ${F(n**3/3)}`},
()=>{const g_=mars?3.71:1.62,m=RI(60,140);return `${m} kg → W = ${F(m*g_,1)} N   (g = ${g_})`},
()=>{const mu=mars?42828:4902.8,a=(mars?3390:1737)+RI(30,300),t=TAU*Math.sqrt(a**3/mu)/60;return `T = 2π√(a³/μ) = ${F(t,1)} min`},
()=>{const k=RI(8,40),v=R(2,6);return `range ${k} km ÷ ${F(v,1)} km/h = ${F(k/v)} h`},
()=>{const n=RI(8,14);let a=1,b=1;for(let i=0;i<n;i++)[a,b]=[b,a+b];return `F${n+2}/F${n+1} = ${F(b/a,5)} → φ`},
()=>{const d=RI(10,80);return `sin ${d}° = ${F(Math.sin(d*Math.PI/180),4)}`},
()=>{const hr=RI(4,9),l=R(30,38);return `O₂: ${hr} h × ${F(l,1)} L/h = ${F(hr*l,1)} L`}];
const NB={lines:[],cur:null,wait:1};
function genLine(){let t=Math.random()<h*h*.55?WEIRD[RI(0,WEIRD.length-1)]:gens[RI(0,gens.length-1)]();
if(Math.random()<h*.6)t=t.replace(/\d/g,d=>Math.random()<.15+.3*h?RI(0,9):d);if(Math.random()<h*.4)t+=' '+'◉⌬⍜⟁☍∴'[RI(0,5)];return t}
function nbUpdate(dt){const cps=2.5+13*wr;if(!NB.cur){NB.wait-=dt;if(NB.wait<=0){NB.cur={t:genLine(),n:0};NB.lines.push(NB.cur)}}else{NB.cur.n+=dt*cps;if(NB.cur.n>=NB.cur.t.length){NB.cur.n=NB.cur.t.length;NB.cur=null;NB.wait=R(.6,2.4)}}if(NB.lines.length>40)NB.lines.shift()}
function notebook(){
const k=wr,bh=H*.065,pw=lerp(clamp(W*.19,170,260),clamp(W*.3,250,400),k),ph=lerp(Math.min(H*.27,220),Math.min(H*.46,430),k),
px=W-pw-W*.035,py=lerp(bh+H*.035,H*.15,k),fs=lerp(.78,1,k)*clamp(H*.03,15,26),lh=fs*1.38,s1=S*1.15,hx=astroX+24*s1,hy=astroY-72*s1;
g.save();
/* leader line: astronaut's notebook -> page */
g.strokeStyle=lc(.1+.3*k);g.lineWidth=1;g.setLineDash([4,7]);g.beginPath();g.moveTo(hx,hy);g.quadraticCurveTo((hx+px)/2,Math.min(hy,py+ph/2)-H*.1,px,py+ph/2);g.stroke();g.setLineDash([]);
g.beginPath();g.arc(hx,hy,3,0,TAU);g.stroke();
g.translate(px+pw/2,py+ph/2);g.rotate(-.03+Math.sin(T*.25)*.006);g.translate(-pw/2,-ph/2);
g.globalAlpha=.55+.45*k;g.fillStyle='rgba(6,9,18,.72)';g.strokeStyle=lc(.8);g.lineWidth=1.4;
g.beginPath();g.roundRect(0,0,pw,ph,6);g.fill();g.stroke();
for(let i=0;i<9;i++){const y=16+i*(ph-32)/8;g.beginPath();g.arc(0,y,4,0,TAU);g.stroke()}
g.fillStyle=lc(.14);g.fillRect(pw/2-24,-8,48,16);g.strokeRect(pw/2-24,-8,48,16);
const gh=ph*.24,top=fs*1.2,max=Math.floor((ph-gh-fs*1.6)/lh);
g.strokeStyle=lc(.12);for(let i=0;i<max;i++){const y=top+i*lh+6;g.beginPath();g.moveTo(14,y);g.lineTo(pw-10,y);g.stroke()}
g.font=`${fs}px Caveat,"Segoe Script","Bradley Hand",cursive`;g.fillStyle=lc(.95,88,h*20);g.textBaseline='alphabetic';g.textAlign='left';
const ls=NB.lines.slice(-max);let ey=0,ex=0;
ls.forEach((l,i)=>{const t=l.t.slice(0,Math.floor(l.n)),jy=h>.4?Math.sin(T*3+i*2)*h*1.5:0,y=top+i*lh+jy;g.fillText(t,18,y,pw-30);if(l===NB.cur){ex=18+Math.min(g.measureText(t).width,pw-30);ey=y}});
g.strokeStyle=lc(.9);if(NB.cur&&Math.sin(T*9)>0){g.beginPath();g.moveTo(ex+3,ey-fs*.6);g.lineTo(ex+3+fs*.15,ey+2);g.stroke()}
const gx=16,gw=pw-32,gb=ph-14,gm=gb-gh/2;g.strokeStyle=lc(.5);g.lineWidth=1;g.beginPath();g.moveTo(gx,gb-gh);g.lineTo(gx,gb);g.lineTo(gx+gw,gb);g.stroke();
g.strokeStyle=lc(.9,80,h*40);g.beginPath();for(let i=0;i<=gw;i+=3){const x=i/gw*14+T*.4,y=Math.sin(x)*(1-h*.4)+Math.sin(x*3.1+T)*h*.8+Math.sin(x*9)*h*h*.5;i?g.lineTo(gx+i,gm-y*gh*.32):g.moveTo(gx+i,gm-y*gh*.32)}g.stroke();
g.restore()}

/* extra motion: drifting dust, wind haze, shooting stars */
const rd=mul(7),motes=[...Array(90)].map(()=>({x:rd(),y:rd(),z:rd(),p:rd()*9})),meteors=[];
function dust(dt){wo+=dt*wind;
if(mars){const gr=g.createLinearGradient(0,H*.4,0,H*.85);gr.addColorStop(0,'hsla(18,70%,45%,0)');gr.addColorStop(1,`hsla(18,70%,45%,${.06+.2*wind})`);g.fillStyle=gr;g.fillRect(-20,H*.4,W+40,H*.5)}
const n=Math.floor(motes.length*(mars?1:.55));g.lineWidth=1;
for(let i=0;i<n;i++){const m=motes[i],x=(((m.x*W-cam*(.5+m.z*1.6)-wo*(8+m.z*40)*S)%W)+W)%W,y=H*.35+m.y*H*.55+Math.sin(T*.6+m.p)*10*S,l=(2+m.z*10*(mars?wind+.3:.3))*S;
g.strokeStyle=lc(.12+.3*m.z);g.beginPath();g.moveTo(x,y);g.lineTo(x-l,y+l*.1);g.stroke()}}
function shoot(dt){if(dt>0&&Math.random()<.22*dt)meteors.push({x:R(.2,1.1)*W,y:R(.08,.4)*H,v:R(500,900)*S,a:R(.25,.5),t:0,L:R(.6,1.1)});
for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.t+=dt;const f=m.t/m.L;if(f>=1){meteors.splice(i,1);continue}
const x=m.x-m.v*m.t,y=m.y+m.v*m.t*m.a,tl=120*S;g.strokeStyle=lc((1-f)*.9,92);g.lineWidth=1.4;g.beginPath();g.moveTo(x,y);g.lineTo(x+tl,y-tl*m.a);g.stroke()}}

/* creatures */
const beings=[];
function spawn(){const type=RI(0,4),sky=type===1||type===2,age0=Math.random()<.5;
beings.push({type,seed:Math.random()*100,x:cam+(age0?R(.2,.95):R(1.02,1.35))*W,sy:R(.12,.5),d:Math.random(),t0:T,life:R(14,36),sc:R(.7,1.5),hue:[300,330,45,165,275][RI(0,4)],vx:R(-42,26),n:RI(3,7),ne:RI(1,6),sky})}
function blob(rx,ry,n,w,tt,sd){g.beginPath();for(let i=0;i<=n;i++){const a=i/n*TAU,k=1+w*Math.sin(a*3+tt*1.3+sd)+w*.6*Math.sin(a*5-tt*.9+sd*2),x=Math.cos(a)*rx*k,y=Math.sin(a)*ry*k;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath();g.stroke()}
function eye(x,y,r,an,sd){const bl=Math.sin(T*.6+sd*9)>.965?.12:1,c=Math.cos(an),s=Math.sin(an);g.beginPath();g.ellipse(x,y,r*1.3,r*bl,0,0,TAU);g.stroke();g.beginPath();g.ellipse(x+c*r*.4,y+s*r*.25*bl,r*.55,r*.55*bl,0,0,TAU);g.stroke();g.beginPath();g.arc(x+c*r*.55,y+s*r*.35*bl,Math.max(.1,r*.18*bl),0,TAU);g.fill()}
const poly=(p)=>{g.beginPath();p.forEach((v,i)=>i?g.lineTo(v[0],v[1]):g.moveTo(v[0],v[1]));g.stroke()};
function being(b,tt,an,ax,ay){
if(b.type===0){const by=-90-Math.sin(tt*1.6)*3;g.save();g.translate(0,by);blob(38,26,28,.07,tt,b.seed);for(let i=0;i<b.ne;i++)eye((i-(b.ne-1)/2)*15,-4+Math.sin(i*2+b.seed)*8,6,an,b.seed+i);g.restore();
for(let i=0;i<b.n;i++){const hx=(i-(b.n-1)/2)*(70/b.n),sd=hx<0?-1:1,ph=tt*1.1+i*1.7,fx=hx*2.3+Math.sin(ph)*14,fy=-Math.max(0,Math.cos(ph))*12;poly([[hx,by+20],[hx+sd*40,by-18],[fx,fy]])}}
else if(b.type===1){const p=1+.08*Math.sin(tt*2);g.beginPath();g.ellipse(0,0,55*p,42*p,0,Math.PI,TAU);g.stroke();for(let i=0;i<=6;i++){const x=-55+i*18.3;poly([[0,-42*p],[x*.5,-30*p],[x,0]])}
for(let i=0;i<8;i++){const x0=-50+i*14.3,pts=[];for(let j=0;j<14;j++)pts.push([x0+Math.sin(tt*1.4+j*.5+i)*(4+j*.9),j*9]);poly(pts)}eye(0,-16,14,an,b.seed)}
else if(b.type===2){const N=b.n+4,r=70*(1+.1*Math.sin(tt));for(let L=0;L<3;L++){g.save();g.rotate(tt*.2*(L%2?-1:1)+L);const rr=r*(1-L*.28);g.beginPath();for(let i=0;i<N;i++){const a=i/N*TAU,a2=(i+.5)/N*TAU;g.moveTo(0,0);g.quadraticCurveTo(Math.cos(a2)*rr*.6,Math.sin(a2)*rr*.6,Math.cos(a)*rr,Math.sin(a)*rr)}g.stroke();if(L===0)for(let i=0;i<N;i++){const a=i/N*TAU;eye(Math.cos(a)*rr*1.08,Math.sin(a)*rr*1.08,4,an,b.seed+i)}g.restore()}eye(0,0,13,an,b.seed)}
else if(b.type===3){const m=b.n+3;for(let i=0;i<m;i++){const y=-i*22-6,sw=Math.sin(tt*.7+i*.4)*i*2.2,w=40*(.4+.6*Math.abs(Math.sin(i*1.3+b.seed)));g.beginPath();g.ellipse(sw,y,w,9,0,0,TAU);g.stroke();if(i%2)eye(sw,y,4,an,b.seed+i);if(i<m-1){const y2=-(i+1)*22-6,sw2=Math.sin(tt*.7+(i+1)*.4)*(i+1)*2.2,w2=40*(.4+.6*Math.abs(Math.sin((i+1)*1.3+b.seed)));poly([[sw-w,y],[sw2-w2,y2]]);poly([[sw+w,y],[sw2+w2,y2]])}
if(i%3===1){for(const d of[-1,1]){const p=[];for(let j=0;j<8;j++)p.push([sw+d*(w+j*9),y-j*3+Math.sin(tt*1.5+j*.6+d)*7]);poly(p)}}}
const ty=-m*22-6;for(let i=-2;i<=2;i++)poly([[0,ty],[i*14,ty-26-Math.abs(i)*-4]])}
else{g.save();g.scale(.55,1.9);astro(0,0,1,tt*3,0,0,true);g.restore()}}
function drawBeing(b){const age=T-b.t0,e=sm(0,3,age)*(1-sm(b.life-5,b.life,age));if(e<=.01)return;
const wx=b.x+b.vx*age,sx=wx-cam+Math.sin(T*.7+b.seed)*14*S;if(sx<-250*S||sx>W+250*S)return;
const sy=b.sky?H*b.sy+Math.sin(T*.5+b.seed)*18*S:gy(wx)-b.d*26*S-Math.max(0,Math.sin(T*1.1+b.seed))*8*S,sc=b.sc*S*(b.sky?1:1-.35*b.d),an=Math.atan2(astroY-sy,astroX-sx),tt=T*.8+b.seed,
a=e*(.35+.65*h)*(Math.random()<.02+.1*h*h?.25:1),col=`hsla(${b.hue},85%,72%,${a})`;
g.save();g.translate(sx+(h>.6&&Math.random()<.05?R(-6,6):0),sy);g.scale(sc,sc);g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1.5/sc;g.shadowColor=col;g.shadowBlur=10;
being(b,tt,an);g.restore()}

/* astronaut */
let astroX=0,astroY=0;
function astro(x,y,s,ph,w,hh,ghost){
g.save();g.translate(x,y);g.scale(s,s);g.lineWidth=1.6/s;g.lineJoin='round';g.lineCap='round';
const bob=Math.abs(Math.sin(ph))*2*(1-w),hy=-48-bob;
for(const sd of[0,1]){const a=Math.sin(ph+sd*Math.PI)*.55*(1-w)+(w?(sd?.1:-.1):0),kx=Math.sin(a)*24,ky=hy+Math.cos(a)*24,a2=a*.3-.15-.4*Math.max(0,Math.cos(ph+sd*Math.PI))*(1-w),fx=kx+Math.sin(a2)*24,fy=ky+Math.cos(a2)*24;
poly([[0,hy],[kx,ky],[fx,fy]]);g.beginPath();g.moveTo(fx-5,fy-2);g.lineTo(fx+9,fy-2);g.lineTo(fx+9,fy+3);g.lineTo(fx-5,fy+3);g.closePath();g.stroke()}
g.beginPath();g.roundRect(-15,-94-bob,30,48,8);g.stroke();
g.beginPath();g.roundRect(-28,-90-bob,13,38,4);g.stroke();poly([[-22,-90-bob],[-22,-100-bob],[-26,-106-bob]]);
poly([[-12,-84-bob],[-12,-58-bob]]);g.strokeRect(2,-82-bob,10,7);g.beginPath();g.arc(5,-70-bob,1.6,0,TAU);g.stroke();g.beginPath();g.arc(10,-70-bob,1.6,0,TAU);g.stroke();
const hx=4,hcy=-108-bob;g.beginPath();g.arc(hx,hcy,18,0,TAU);g.stroke();
g.beginPath();g.ellipse(hx+6,hcy,11,12.5,0,0,TAU);g.stroke();
poly([[hx-9,hcy+17],[hx+9,hcy+17]]);
if(!ghost){g.save();g.beginPath();g.ellipse(hx+6,hcy,11,12.5,0,0,TAU);g.clip();
if(hh>.35){const t2=T*.5;g.strokeStyle=`hsla(310,85%,75%,${(hh-.3)*1.2})`;g.fillStyle=g.strokeStyle;g.lineWidth=1/s;g.translate(hx+6,hcy);g.scale(.07,.07);for(let i=0;i<3;i++)eye((i-1)*40+Math.sin(t2+i)*10,Math.sin(t2*1.3+i*2)*30,18,Math.sin(t2)*2,i)}
else{g.beginPath();g.arc(hx+8,hcy-4,3,0,TAU);g.stroke()}g.restore()}
else{g.fillStyle=g.strokeStyle;eye(hx+6,hcy-2,5,0,3);eye(hx+6,hcy+6,3,0,5)}
const sh=[2,-86-bob],hand=[[0,0]];
const ws=T*14,wh=[22+Math.sin(ws)*2.5,-70-bob+Math.cos(ws*1.3)*1.5],lh=[24,-72-bob];
for(const k of[0,1]){const a=Math.sin(ph+(k?0:Math.PI))*.7*(1-w),wxk=[sh[0]+Math.sin(a)*40,sh[1]+Math.cos(a)*40],tg=k?wh:lh,p=[lerp(wxk[0],tg[0],w),lerp(wxk[1],tg[1],w)],el=[(sh[0]+p[0])/2-5,(sh[1]+p[1])/2+7];poly([sh,el,p]);
if(k===0&&!ghost){g.save();g.translate(p[0]+3,p[1]-5);g.rotate(lerp(.3,-.15,w));g.strokeRect(-4,-9,15,20);poly([[0,-9],[0,11]]);g.restore()}}
g.restore()}

/* rover */
function rover(sx,k,sc){const wxs=[-46,0,46],ys=wxs.map(w=>gy(sx+w*sc+cam)),avg=(ys[0]+ys[1]+ys[2])/3,sl=Math.atan2(ys[2]-ys[0],92*sc);
g.save();g.translate(sx,avg);g.rotate(sl*.9);g.scale(sc,sc);g.lineWidth=1.5/sc;g.lineJoin='round';
const rot=cam/(13*sc);
g.beginPath();g.moveTo(-58,-30);g.lineTo(-50,-52);g.lineTo(30,-52);g.lineTo(56,-36);g.lineTo(56,-28);g.lineTo(-58,-28);g.closePath();g.stroke();
poly([[-50,-40],[40,-40]]);g.strokeRect(-30,-50,22,10);
poly([[-54,-54],[-44,-68],[30,-68],[20,-54]]);poly([[-40,-54],[-34,-68]]);poly([[-10,-54],[-4,-68]]);poly([[10,-54],[14,-68]]);
if(k===0){poly([[22,-52],[22,-92]]);g.strokeRect(14,-102,16,10);g.beginPath();g.arc(22,-97,2.4,0,TAU);g.stroke();
poly([[-42,-68],[-42,-80]]);g.beginPath();g.ellipse(-42,-84,12,5,Math.sin(T*.3)*.6-.3,0,TAU);g.stroke();poly([[-42,-84],[-34,-92]])}
else{g.strokeRect(28,-104,12,52);for(let i=0;i<5;i++)poly([[28,-98+i*10],[40,-92+i*10]]);poly([[34,-52],[34,-30],[31,-22]]);
poly([[56,-34],[72,-50],[88,-36],[84,-30],[88,-36],[92,-32]])}
if(Math.floor(T*1.3)%2){g.beginPath();g.arc(k?34:22,k?-108:-106,2.5,0,TAU);g.fill()}
poly([[-46,-13],[-30,-28]]);poly([[0,-13],[0,-28]]);poly([[46,-13],[30,-28]]);

function layer(par,base,amp,k,fill,stk,lw){const off=cam*par;g.beginPath();g.moveTo(-10,H+10);
for(let x=-10;x<=W+10;x+=8){const wx=x+off,y=H*base-(.5+.5*ridge(wx,k))*H*amp-Math.abs(Math.sin(wx*.017+k*2))*H*amp*.22;g.lineTo(x,y)}

const n=Math.floor(r()*(mars?5:3));for(let j=0;j<n;j++){const x=i*cell+r()*cell,sx=x-cam,y=gy(x)+2,z=(6+r()*20)*S,p=[];for(let m=0;m<6;m++){const a=m/6*Math.PI+Math.PI;p.push([sx+Math.cos(a)*z*(.7+r()*.5),y+Math.sin(a)*z*(.6+r()*.4)])}p.push([sx+z,y],[sx-z,y]);g.beginPath();g.moveTo(sx-z,y);p.slice(0,6).forEach(v=>g.lineTo(v[0],v[1]));g.lineTo(sx+z,y);g.closePath();g.stroke();poly([[sx-z*.2,y-z*.5],[sx+z*.1,y]])}}}

g.strokeStyle=lc(.85);g.lineWidth=1.4;
const sr=(mars?11:18)*S,sx=W*(.08+.84*LF),sy=H*(.27-.15*Math.sin(LF*Math.PI));g.beginPath();g.arc(sx,sy,sr,0,TAU);g.stroke();for(let i=0;i<12;i++){const a=i/12*TAU+T*.02;poly([[sx+Math.cos(a)*sr*1.4,sy+Math.sin(a)*sr*1.4],[sx+Math.cos(a)*sr*(i%2?1.8:2.2),sy+Math.sin(a)*sr*(i%2?1.8:2.2)]])}

for(let i=0;i<3;i++){g.beginPath();g.ellipse(ex-er*.2+i*er*.25,ey+(i-1)*er*.35,er*.2,er*.12,i+T*.05,0,Math.PI*1.4);g.stroke()}}
else{for(const[k,sz,sp]of[[0,7,.0017],[1,4,.0008]]){const f=((T*sp+k*.4)%1),x=W*(.1+.8*f),y=H*(.3-.1*Math.sin(f*Math.PI)),r=sz*S;g.beginPath();for(let i=0;i<7;i++){const a=i/7*TAU+T*.3,rr=r*(.8+.3*Math.sin(i*5+k));i?g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):g.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}g.closePath();g.stroke()}}
/* the eye in the sky */

g.beginPath();g.moveTo(cx-w,cy);g.quadraticCurveTo(cx,cy-o*2.4,cx+w,cy);g.quadraticCurveTo(cx,cy+o*2.4,cx-w,cy);g.stroke();

for(let i=-3;i<=3;i++)poly([[cx+i*w*.28,cy-o*1.6*(1-Math.abs(i)/4)-6],[cx+i*w*.32,cy-o*2.2*(1-Math.abs(i)/4)-14]])}}

function frame(now){
let dt=Math.min(.1,(now-last)/1000);if(!isFinite(dt)||dt<0)dt=0;if(!isFinite(T))T=0;last=now;if(paused)dt=0;dt*=speed;T+=dt;

const zz=1.02+.01*Math.sin(T*.11),shx=(Math.sin(T*.7)*3+Math.sin(T*1.9)*1.2)*wf,shy=(Math.sin(T*.55)*2.5+Math.sin(T*1.6)*1.1)*wf;

const bg=mars?'hsl(10,42%,9%)':'hsl(225,40%,7%)',bg2=mars?'hsl(10,42%,6%)':'hsl(225,40%,5%)',bg3=mars?'hsl(8,40%,4%)':'hsl(225,35%,3%)';
layer(.12,.64,.07,2,bg,lc(.35),1.2);layer(.35,.70,.05,5,bg2,lc(.5),1.3);
/* ground */
g.beginPath();g.moveTo(-10,H+10);for(let x=-10;x<=W+10;x+=6)g.lineTo(x,gy(x+cam));g.lineTo(W+10,H+10);g.closePath();g.fillStyle=bg3;g.fill();g.strokeStyle=lc(.95);g.lineWidth=2;g.stroke();
[10,24,44,70,104,150].forEach((o,k)=>{g.strokeStyle=lc(.4-k*.05);g.lineWidth=1;g.setLineDash([14*S,(10+k*5)*S]);g.lineDashOffset=-cam*(1+k*.1);g.beginPath();for(let x=-10;x<=W+10;x+=8){const y=gy(x+cam*(1+k*.05))+o*S*(1+ridge(x+cam,k+3)*.2);x>-10?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()});g.setLineDash([]);

g.strokeStyle=lc(.4);g.setLineDash([6*S,5*S]);for(const o of[4,9]){g.beginPath();for(let x=-10;x<=astroX-60*S;x+=10){const y=gy(x+cam)+o*S;x>-10?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}g.setLineDash([]);
for(const b of beings)drawBeing(b);
g.strokeStyle=lc(.95);g.fillStyle=lc(.95);
rover(astroX-370*S,1,1.05*S);rover(astroX-180*S,0,1.1*S);
g.save();g.translate(astroX,astroY);g.rotate(Math.atan2(gy(astroX+cam+30)-gy(astroX+cam-30),60)*.8);g.translate(-astroX,-astroY);
g.strokeStyle=lc(1,90);astro(astroX,astroY,S*1.15,stepPh,wr,h);g.restore();dust(dt);g.restore();
notebook();

/* glitches */
if(h>.5&&Math.random()<.04*h){for(let i=0;i<RI(1,3);i++){const y=R(0,H*.9),hh=R(6,40);g.drawImage(cv,0,y*DPR,cv.width,hh*DPR,R(-24,24),y,W,hh)}}
g.fillStyle=scan;g.fillRect(0,0,W,H);g.fillStyle=vig;g.fillRect(0,0,W,H);
/* letterbox + HUD */
const bh=H*.065,hm=String(Math.floor(T/3600)).padStart(2,'0'),mm=String(Math.floor(T/60)%60).padStart(2,'0'),ss=String(Math.floor(T)%60).padStart(2,'0');
g.fillStyle='#000';g.fillRect(0,0,W,bh);g.fillRect(0,H-bh,W,bh);

g.textAlign='right';const o2=Math.round(84+9*Math.sin(T/520)-Math.sin(T/40)*2);g.fillText(`O2 ${h>.85&&Math.random()<.3?'◉◉':o2}%   pwr ${Math.round(74+12*Math.sin(T/700+1)+Math.sin(T/70)*5)}%`,W*.97,H-bh/2);
g.textAlign='center';g.fillText(`${C.n} — ${C.loc}`,W/2,bh/2);
/* titles & fades */
const tl=local-(ch===0?7:0),ta=sm(1,3,tl)*(1-sm(8,10,tl));
if(ta>0){g.globalAlpha=ta;g.textAlign='left';g.fillStyle=lc(1,90);g.font=`${clamp(H*.07,28,64)}px Caveat,"Segoe Script",cursive`;g.fillText(C.n,W*.06,H*.84);g.font=`${fs*1.1}px "Space Mono",monospace`;g.fillText(C.loc,W*.06,H*.84+H*.05);g.globalAlpha=1}
let fade=ch>0||T>0?1-sm(0,2.5,local):0;fade=Math.max(fade,sm(CHL-3,CHL,local));
if(ch===0&&local<7)fade=Math.max(fade,1-sm(5,7,local));
if(fade>0){g.fillStyle=`rgba(0,0,0,${fade})`;g.fillRect(0,0,W,H)}
if(ch===0&&local<6.5){const a=sm(.5,1.5,local)*(1-sm(5,6.3,local));g.globalAlpha=a;g.textAlign='center';g.fillStyle=lc(1,90);g.font=`${clamp(H*.08,32,76)}px Caveat,"Segoe Script",cursive`;g.fillText('Field Notes from Nowhere',W/2,H*.47);g.font=`${fs*1.1}px "Space Mono",monospace`;g.fillStyle=lc(.7);g.fillText('an endless transmission. just observe.',W/2,H*.47+H*.07);g.globalAlpha=1}
